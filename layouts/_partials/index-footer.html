{{/* Homepage footer: name and feed link only, no theme credit line.
     Matches the pre-migration layout. */}}
<p>&copy; {{ now.Format (default "2006" .Site.Params.dateform.CopyrightDate) }}
	<a href="{{ .Site.BaseURL }}">{{ lower .Site.Params.author.name }}</a>
	<a href="{{ "posts/index.xml" | absURL }}" target="_blank" title="rss">{{- partial "svg.html" (dict "context" . "name" "rss") -}}</a>
</p>
