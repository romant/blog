baseURL = "https://www.romant.net"
locale = "en-us"
defaultContentLanguage = "en"
title = "RomanT.net"
theme = "hermit-v2"
copyright = "This work is licensed under a Attribution-NonCommercial-ShareAlike 4.0 International License."
enableEmoji = true  # Shorthand emojis in content files - https://gohugo.io/functions/emojify/
enableRobotsTXT = true
removePathAccents = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true   # posts use raw <figure>/<img> HTML; without this they are stripped
  [markup.highlight]
    codeFences = true
    noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"

# hermit-V2 gates scroll-to-top and read time on a per-page front matter flag
# as well as the site param. Cascade turns them on for every post rather than
# editing 55 files.
[[cascade]]
  [cascade.params]
    scrolltotop = true
    readTime = true
  [cascade._target]
    kind = "page"

[params]
  homeSubtitle = "hilariously not funny"
  footerCopyright = ' &#183; <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  justifyContent = false

  # Palette. Background and body text are set in assets/scss/_userstyles.scss;
  # these two are the values the theme reads directly.
  themeColor  = "#2c3e50"
  accentColor = "#018574"

  # Render the home subtitle statically rather than typing it out.
  homeSubtitlePrinter = false

  # hermit-V2 features
  code_copy_button = true
  scrollToTop      = true
  shareSocial      = true
  pinned           = "Pinned Posts"

  [params.author]
    name = "Roman Tarnavski"

  [params.dateform]
    CopyrightDate = "2006"
    LongDate       = "Jan 2, 2006"
    ShortDate      = "Jan 2"
    NumDateShort   = "2006-01-02"
    NumDateLong    = "2006-01-02 15:04 -0700"

  [params.pages]
    relatedPosts      = true
    readTimeSeparator = "… ⏲ Reading Time:"
    lastUpdatedOn     = "Last updated on: "
    LastmodOpen       = "["
    LastmodClose      = "]"

  [params.gallery]
    enable = true
    width  = "300"
    layout = "grid"

  [[params.socialLinks]]
    name = "twitter"
    url = "https://twitter.com/romant"

  [[params.socialLinks]]
    name = "instagram"
    url = "https://instagram.com/romant"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/romant"

  [[params.socialLinks]]
    name = "linkedin"
    url = "https://linkedin.com/in/tarnavski"

  [[menu.main]]
    name = "Archive"
    url = "/posts/"
    weight = 10

[permalinks]
  posts = "/:year/:month/:slug/"
