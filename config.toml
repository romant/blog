baseURL = "https://www.romant.net"
locale = "en-us"
defaultContentLanguage = "en"
title = "RomanT.net"
theme = "hermit-v2"
copyright = "This work is licensed under a Attribution-NonCommercial-ShareAlike 4.0 International License."
enableEmoji = true  # Shorthand emojis in content files - https://gohugo.io/functions/emojify/
enableRobotsTXT = true
removePathAccents = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  threshold = 80
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "date"
    weight = 10

[[cascade]]
  [cascade.params]
    scrolltotop = true
  [cascade.target]
    kind = "page"

[params]
  homeSubtitle = "hilariously not funny"
  footerCopyright = ' &#183; <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  justifyContent = false

  themeColor  = "#2c3e50"
  accentColor = "#c6cddb"

  homeSubtitlePrinter = false

  code_copy_button = true
  scrollToTop      = true
  shareSocial      = false
  pinned           = "Pinned Posts"
  legacyLayout     = true

  [params.author]
    name = "Roman Tarnavski"

  [params.dateform]
    CopyrightDate = "2006"
    LongDate       = "Jan 2, 2006"
    ShortDate      = "Jan 2"
    NumDateShort   = "2006-01-02"
    NumDateLong    = "2006-01-02 15:04 -0700"

  [params.pages]
    relatedPosts      = true
    readTimeSeparator = "… ⏲ Reading Time:"
    lastUpdatedOn     = "Last updated on: "
    LastmodOpen       = "["
    LastmodClose      = "]"

  [params.gallery]
    enable = false
    width  = "300"
    layout = "grid"

  [[params.socialLinks]]
    name = "twitter"
    url = "https://twitter.com/romant"

  [[params.socialLinks]]
    name = "instagram"
    url = "https://instagram.com/romant"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/romant"

  [[params.socialLinks]]
    name = "linkedin"
    url = "https://linkedin.com/in/tarnavski"

  [[menu.main]]
    name = "Archive"
    url = "/posts/"
    weight = 10

[permalinks]
  posts = "/:year/:month/:slug/"
